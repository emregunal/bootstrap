# Secret-scanning patterns.
#
# Format:  id|severity|description|regex
# Severity: high and medium block a commit, low is reported as a warning.
#
# The regex comes LAST on purpose. Regexes contain '|' themselves, and the
# shell's `read` assigns everything after the final named field — delimiters
# included — to the last variable, so the pattern survives intact.
#
# The regexes deliberately require the *shape* of a real credential rather than
# just its prefix: "sk-" in prose is not a finding, "sk-" followed by twenty
# key characters is. That is what keeps this usable as a pre-commit hook.
#
# Whatever a regex matches is then tested against the placeholder allowlist in
# scripts/git/preflight.sh, so {env:VAR}, $VAR, <your-token> and the empty
# assignments in .env.example never register.
#
# This file is excluded from scanning — the patterns below would match it.

github-classic|high|GitHub personal access token|ghp_[A-Za-z0-9]{36}
github-finegrained|high|GitHub fine-grained token|github_pat_[A-Za-z0-9_]{22,}
github-oauth|high|GitHub OAuth/refresh token|gh[ousr]_[A-Za-z0-9]{36}
openai-style|high|OpenAI-style API key|sk-[A-Za-z0-9_-]{20,}
google-api|high|Google API key|AIza[0-9A-Za-z_-]{35}
slack-token|high|Slack token|xox[abprs]-[A-Za-z0-9-]{10,}
aws-access-key|high|AWS access key id|(AKIA|ASIA|A3T[A-Z0-9])[A-Z0-9]{16}
context7-key|high|Context7 API key|ctx7sk-[A-Za-z0-9-]{16,}
private-key|high|Private key block|BEGIN [A-Z ]*PRIVATE KEY
bearer-literal|medium|Literal bearer token|Bearer [A-Za-z0-9._~+/=-]{16,}
credential-assign|medium|Credential assignment with a value|(password|passwd|secret|token|api_?key|access_?key|client_?secret|PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|ACCESS_?KEY|CLIENT_?SECRET)[[:space:]]*[=:][[:space:]]*["']?[^"'[:space:]]{8,}
connection-string|medium|Connection string with inline credentials|[A-Za-z][A-Za-z0-9+.-]*://[^/[:space:]:@]+:[^/[:space:]@]+@
