# Frontend / UI-UX / React / Next.js
#
# Format:  owner/repo|skill-name
# The skill-name must match the `name:` field in the skill's SKILL.md,
# which is not always the same as its folder name in the repository.
#
# One primary skill per intent, so descriptions do not overlap and the agent
# does not load two conflicting rule sets for the same task:
#   new landing page / portfolio / redesign  -> design-taste-frontend
#   product UI, dashboards, audit, polish     -> impeccable
#   interface-guideline checklist audit       -> web-design-guidelines
#   scroll / motion / GSAP                    -> awwwards-animations
#   palette, font and style lookup data       -> ui-ux-pro-max

