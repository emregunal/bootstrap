# Installation profiles.
#
# Format:  profile-name|manifest,manifest,...
# `./bootstrap.sh --profile <name>` installs only the listed manifests.
# Each manifest name also works as a profile on its own, e.g. --profile database.

frontend|frontend
backend|backend,database
devops|devops,security
testing|testing
security|security
full|frontend,backend,database,devops,testing,security
